<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>EVA UNIT-01 | INTERNAL SYSTEM</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --eva-purple: #5F2A62;
      --eva-green: #A0DE59;
      --eva-dark: #120A1A;
      --alert-red: #ff3c3c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: crosshair;
    }

    body {
      background-color: var(--eva-dark);
      color: var(--eva-green);
      font-family: 'Orbitron', 'Noto Sans SC', sans-serif;
      height: 100vh;
      overflow: hidden;
      /* LCL 液体流动的微弱视觉感 */
      background: radial-gradient(circle at center, #231531 0%, #120A1A 100%);
    }

    /* --- 背景噪点与动态网格 --- */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(160, 222, 89, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(160, 222, 89, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 10;
    }

    /* --- 顶端：战术状态栏 --- */
    .header {
      position: absolute;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 20px 40px;
      background: linear-gradient(to bottom, rgba(95, 42, 98, 0.3), transparent);
      border-bottom: 1px solid var(--eva-purple);
      z-index: 20;
    }

    .header-box {
      border: 1px solid var(--eva-green);
      padding: 5px 15px;
      font-size: 12px;
    }

    /* --- 核心：圆形同步率表盘 --- */
    .sync-sphere {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      border: 2px solid var(--eva-purple);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 50px rgba(95, 42, 98, 0.5);
    }

    .sync-sphere::before {
      content: "";
      position: absolute;
      width: 110%;
      height: 110%;
      border: 1px dashed var(--eva-green);
      border-radius: 50%;
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .sync-data {
      text-align: center;
    }

    .sync-data h2 {
      font-size: 14px;
      letter-spacing: 5px;
      color: var(--eva-purple);
      background: var(--eva-green);
      display: inline-block;
      padding: 2px 10px;
    }

    .sync-percent {
      font-size: 80px;
      font-weight: bold;
      text-shadow: 0 0 20px var(--eva-green);
    }

    /* --- 侧边：机体受损监控 (CSS 绘制机体剪影) --- */
    .status-panel {
      position: absolute;
      left: 40px;
      top: 150px;
      width: 200px;
    }

    .damage-indicator {
      height: 300px;
      width: 100px;
      margin: 20px auto;
      border: 1px solid var(--eva-green);
      position: relative;
      background: rgba(160, 222, 89, 0.1);
      clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
    }

    /* --- 底部：电池剩余量 (Internal Battery) --- */
    .power-system {
      position: absolute;
      bottom: 40px;
      right: 40px;
      width: 300px;
      text-align: right;
    }

    .battery-grid {
      display: flex;
      gap: 5px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .battery-cell {
      width: 15px;
      height: 30px;
      border: 1px solid var(--eva-green);
    }

    .battery-cell.active {
      background: var(--eva-green);
      box-shadow: 0 0 10px var(--eva-green);
      animation: flicker 1s infinite;
    }

    @keyframes flicker {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    /* --- 浮动警告文字 --- */
    .floating-text {
      position: absolute;
      font-size: 10px;
      color: var(--eva-purple);
      white-space: nowrap;
    }

    /* 暴走模式文字特效 */
    .berserk-btn {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 60px;
      background: transparent;
      border: 2px solid var(--alert-red);
      color: var(--alert-red);
      font-weight: bold;
      letter-spacing: 10px;
      transition: 0.3s;
      text-decoration: none;
      overflow: hidden;
    }

    .berserk-btn:hover {
      background: var(--alert-red);
      color: white;
      box-shadow: 0 0 30px var(--alert-red);
    }

    /* 装饰用的小方块和坐标 */
    .coords {
      position: absolute;
      font-size: 10px;
      color: rgba(160, 222, 89, 0.4);
    }
  </style>
</head>

<body>

  <div class="overlay"></div>

  <header class="header">
    <div class="header-box">MODEL: EVANGELION UNIT-01</div>
    <div class="header-box" style="color: var(--alert-red); border-color: var(--alert-red);">STATUS: BERSERK POTENTIAL
    </div>
    <div class="header-box">PILOT: THIRD CHILDREN</div>
  </header>

  <!-- 核心同步表盘 -->
  <div class="sync-sphere">
    <div class="sync-data">
      <h2>SYNCHRONIZATION</h2>
      <div class="sync-percent" id="percent">00.00%</div>
      <p style="font-size: 10px; margin-top: 10px;">L.C.L DENSITY: NORMAL</p>
    </div>
  </div>

  <!-- 左侧状态 -->
  <div class="status-panel">
    <p style="font-size: 12px; text-align: center;">UNIT STATUS</p>
    <div class="damage-indicator">
      <div
        style="position: absolute; top: 20%; width: 100%; height: 2px; background: var(--alert-red); box-shadow: 0 0 10px var(--alert-red);">
      </div>
    </div>
    <div style="font-size: 10px;">
      > HEAD: NOMINAL<br>
      > CORE: STABLE<br>
      > ARM_L: CONNECTED<br>
      > ARM_R: CONNECTED
    </div>
  </div>

  <!-- 右下角电力 -->
  <div class="power-system">
    <p style="font-size: 12px;">INTERNAL BATTERY</p>
    <div class="battery-grid">
      <div class="battery-cell active"></div>
      <div class="battery-cell active"></div>
      <div class="battery-cell active"></div>
      <div class="battery-cell"></div>
      <div class="battery-cell"></div>
    </div>
    <p style="font-size: 24px; margin-top: 5px;">02:54:11</p>
  </div>

  <!-- 坐标装饰点缀 -->
  <div class="coords" style="top: 20%; left: 10%;">X-442.1 / Y-009.2</div>
  <div class="coords" style="top: 70%; right: 15%;">Z-11.5 / S-992.0</div>

  <!-- 底部大按钮 -->
  <a href="#" class="berserk-btn">机体暴走确认</a>

  <script>
    // 一个简单的数字跳动效果，增加动感
    const percentEl = document.getElementById('percent');
    setInterval(() => {
      let val = (Math.random() * 5 + 75).toFixed(2);
      percentEl.innerText = val + "%";
    }, 150);
  </script>
</body>

</html>
