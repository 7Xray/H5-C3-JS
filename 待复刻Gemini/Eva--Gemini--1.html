<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NERV | 人类补完计划终端</title>
  <!-- 引入科技感字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Shippori+Mincho:wght@700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --nerv-red: #B22222;
      --nerv-orange: #F0903A;
      --nerv-black: #050505;
      --glow-green: #A0DE59;
      --scanline-opacity: 0.1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--nerv-black);
      color: var(--nerv-orange);
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
      height: 100vh;
    }

    /* --- 核心高级感：扫描线与干扰效果 --- */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 100;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    /* --- 导航栏：警示纹路设计 --- */
    nav {
      border-bottom: 2px solid var(--nerv-orange);
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: repeating-linear-gradient(45deg,
          rgba(240, 144, 58, 0.1),
          rgba(240, 144, 58, 0.1) 10px,
          transparent 10px,
          transparent 20px);
    }

    .logo {
      font-family: 'Shippori Mincho', serif;
      font-size: 1.8rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      border: 1px solid var(--nerv-orange);
      padding: 5px 15px;
    }

    /* --- 主视口布局 --- */
    main {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
      padding: 40px 5%;
      height: calc(100vh - 80px);
    }

    /* --- 左侧：Hero 标题区 --- */
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 1px solid rgba(240, 144, 58, 0.3);
      padding-left: 30px;
    }

    .status-tag {
      font-size: 0.8rem;
      background: var(--nerv-orange);
      color: black;
      width: fit-content;
      padding: 2px 10px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Shippori Mincho', serif;
      font-size: 5rem;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 10px var(--nerv-orange);
      margin-bottom: 20px;
    }

    .description {
      max-width: 500px;
      line-height: 1.6;
      color: rgba(240, 144, 58, 0.8);
    }

    /* --- 右侧：同步率与 MAGI 系统 --- */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel {
      border: 1px solid var(--nerv-orange);
      padding: 15px;
      background: rgba(240, 144, 58, 0.05);
      position: relative;
    }

    .panel-header {
      font-size: 0.7rem;
      border-bottom: 1px solid var(--nerv-orange);
      margin-bottom: 10px;
      padding-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }

    /* 同步率进度条动画 */
    .sync-rate {
      height: 30px;
      background: #222;
      border: 1px solid #444;
      margin-top: 10px;
      overflow: hidden;
      position: relative;
    }

    .sync-bar {
      height: 100%;
      width: 74.8%;
      background: var(--glow-green);
      box-shadow: 0 0 15px var(--glow-green);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        opacity: 0.7;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.7;
      }
    }

    /* 六边形 MAGI 指示器 */
    .magi-container {
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }

    .hexagon {
      width: 50px;
      height: 30px;
      background: var(--nerv-red);
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      color: white;
      font-weight: bold;
    }

    /* --- 警告弹窗效果 --- */
    .emergency {
      position: absolute;
      bottom: 40px;
      right: 5%;
      border: 2px solid var(--nerv-red);
      color: var(--nerv-red);
      padding: 10px 40px;
      font-weight: bold;
      animation: blink 0.5s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* --- 响应式 --- */
    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 3rem;
      }

      .sidebar {
        display: none;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">NERV</div>
    <div class="time">SYSTEM TIME: 20:15:09</div>
  </nav>

  <main>
    <section class="hero">
      <div class="status-tag">SECURITY LEVEL: AAA</div>
      <h1>EVANGELION<br>UNIT-01</h1>
      <p class="description">
        这是“人类补完计划”的核心执行终端。在这里，我们监控着同步率、使徒接近预警以及 MAGI 三台超级计算机的决策过程。
        不要逃避，真嗣君。
      </p>
      <br>
      <div
        style="border: 1px solid var(--nerv-orange); width: 120px; text-align: center; padding: 10px; cursor: pointer;">
        ACCESS DATA
      </div>
    </section>

    <aside class="sidebar">
      <div class="panel">
        <div class="panel-header">
          <span>SYNC RATE / 同步率</span>
          <span>74.8%</span>
        </div>
        <div class="sync-rate">
          <div class="sync-bar"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span>MAGI SYSTEM STATUS</span>
        </div>
        <div class="magi-container">
          <div class="hexagon">MEL</div>
          <div class="hexagon">BAL</div>
          <div class="hexagon">CAS</div>
        </div>
        <div style="font-size: 0.6rem; text-align: center; margin-top: 10px;">
          CONSENSUS: <span style="color: var(--glow-green);">APPROVED</span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span>PILOT DATA</span>
        </div>
        <p style="font-size: 0.8rem;">ID: 01 / SHINJI IKARI</p>
        <p style="font-size: 0.8rem;">PLUG DEPTH: 10.2m</p>
      </div>
    </aside>
  </main>

  <div class="emergency">EMERGENCY / 紧急事态</div>

</body>

</html>
