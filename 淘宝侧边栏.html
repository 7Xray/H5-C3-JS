      margin-left: 10px;
    }

    .nav_list li {
      height: 32px;
      line-height: 32px;
      margin: 0 8px;
      border-radius: 4px;
      transition: all .3s;
    }

    .nav_list li:first-child,
    .nav_list li:first-child a {
      color: #ff5000;
    }

    .nav_list li:hover {
      background-color: #fff;
    }

    .nav_list li a {
      font-size: 14px;
    }

    .nav_list li a:hover {
      color: #ff5000;
    }

    .nav_list li i {
      font-size: 14px;
      margin: 6px;
    }
  </style>
</head>
