<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="http://at.alicdn.com/t/c/font_4096975_pswyqyk8tdo.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ccc;
    }

    ul {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      list-style: none;
      gap: 5px;
    }

    ul li {
      position: relative;
      width: 80px;
      height: 40px;
      /* 开启子元素的3d空间 */
      transform-style: preserve-3d;
      transition: all .5s;
    }

    ul li span {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      height: 100%;
      line-height: 40px;
      font-size: 16px;
      background: #fff;
      color: #262626;
      text-align: center;
    }

    ul li .front {
      background: #fff;
      color: #3b5999;
      /*构建3D模型，正面；原本是两个重叠，让第一张向前（z）位移高度的一半*/
      transform: translateZ(20px);
    }

    ul li .bottom {
      background: #3b5999;
      color: #fff;
      /*构造底面，原本重叠的两个长方形第一的向前平移20px*/
      /*如果我想要图案方向不变，那么就要先沿着x轴向前（负值）旋转90度，然后向下（Y轴正值）位移高的一半20px*/
      transform: translateY(20px) rotateX(-90deg);
    }

    ul li:hover {
      /*上面构造完了3D模型那么X轴就在模型中间，所以只需要旋转X轴就行*/
      transform: rotateX(90deg);
    }
  </style>
</head>

<body>
  <ul>
    <li>
      <span class="front iconfont icon-QQ"></span>
      <span class="bottom iconfont icon-QQ"></span>
    </li>
    <li>
      <span class="front iconfont icon-weixin"></span>
      <span class="bottom iconfont icon-weixin"></span>
    </li>
    <li>
      <span class="front iconfont icon-douyin"></span>
      <span class="bottom iconfont icon-douyin"></span>
    </li>
    <li>
      <span class="front iconfont icon-xinlangweibo"></span>
      <span class="bottom iconfont icon-xinlangweibo"></span>
    </li>
    <li>
      <span class="front iconfont icon-shouji"></span>
      <span class="bottom iconfont icon-shouji"></span>
    </li>
  </ul>

</body>

</html>
