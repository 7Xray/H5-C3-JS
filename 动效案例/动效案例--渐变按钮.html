<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    a {
      text-decoration: none;
      color: #000;
    }

    @keyframes move {
      to {
        transform: translateX(-50%);
      }
    }

    .btn {
      position: relative;
      display: block;
      width: 180px;
      height: 70px;
      padding: 3px;
      overflow: hidden;
      border-radius: 6px;
      background-color: pink;
      margin: 100px auto;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 100%;
      background: linear-gradient(115deg, #4fcf70, #fad648, #a767e5, #12bcfe, #44ce7b);
      animation: move .75s linear infinite;
    }

    .btn span {
      display: block;
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 3px;
      text-align: center;
      line-height: 67px;
      color: #fff;
      background-color: #000;
    }
    /* 渐变按钮--鼠标放上去有动态边框 */
    .btn2 {
      position: relative;
      display: block;
      width: 180px;
      height: 70px;
      padding: 3px;
      overflow: hidden;
      border-radius: 6px;
      background-color: pink;
      margin: 200px auto;
    }

    .btn2::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 100%;
      background: linear-gradient(115deg, #4fcf70, #fad648, #a767e5, #12bcfe, #44ce7b);
    }

    .btn2 p {
      display: block;
      position: relative;
      /* z-index: 1; */
      width: 100%;
      height: 100%;
      border-radius: 3px;
      text-align: center;
      line-height: 67px;
      color: #fff;
      background-color: #000;
    }

    .btn2:hover::before {
      animation: move .75s linear infinite;
    }
  </style>
</head>

<body>
  <a href="#" class="btn">
    <span>开始游戏</span>
  </a>

  <a href="#" class="btn2">
    <p>开始游戏</p>
  </a>
</body>

</html>
