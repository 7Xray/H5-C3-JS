  <style>
    @keyframes move {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-1200px);
      }
    }

    .box {
      width: 1180px;
      margin: 100px auto;
      overflow: hidden;
      background-color: rgba(104, 48, 48, 0.2);
    }

    .scroll img {
      width: 180px;
      height: 90px;
      border-radius: 6px;
    }

    .scroll {
      display: flex;
      animation: move 20s linear infinite;
    }

    .ad1 {
      display: grid;
      grid-template-columns: repeat(6, 180px);
      grid-template-rows: repeat(4, 90px);
      gap: 16px 20px;
      margin-left: 20px;
    }

    .scroll:hover {
      animation-play-state: paused;
    }
  </style>
</head>
