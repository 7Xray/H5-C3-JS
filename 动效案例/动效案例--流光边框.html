<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1e1f26;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    .btn {
      display: flex;
      position: relative;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      width: 300px;
      height: 200px;
      border: 1px solid #333;
      margin: 50px;
      color: #fff;
      text-align: center;
      line-height: 200px;
      font-size: 24px;
      border-radius: 10px;
      margin: 100px auto;
    }

    .btn span {
      width: 100%;
      height: 100%;
    }

    .btn::before {
      content: '';
      position: absolute;
      height: 500px;
      width: 500px;
      background-image: conic-gradient(transparent, transparent, transparent, #00ccff);
      animation: rotate 1s linear infinite;
      z-index: -1;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 3px;
      background-color: #000;
      border-radius: 10px;
      z-index: -1;
    }

    .btn-x {
      display: flex;
      position: relative;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      width: 300px;
      height: 200px;
      border: 1px solid #333;
      margin: 50px;
      color: #fff;
      text-align: center;
      line-height: 200px;
      font-size: 24px;
      border-radius: 10px;
      margin: 100px auto;
    }

    .btn-x span {
      width: 100%;
      height: 100%;
    }

    .btn-x::before {
      content: '';
      position: absolute;
      height: 500px;
      width: 500px;
      background-image: conic-gradient(transparent, transparent, transparent, #00ccff);
      animation: rotate 1s linear infinite;
      z-index: -1;
    }

    .btn-x::after {
      content: '';
      position: absolute;
      inset: 2px 0px;
      background-color: #000;
      border-radius: 5px;
      z-index: -1;
    }
  </style>
</head>

<body>
  <div class="btn">
    <span>流光边框</span>
  </div>

  <div class="btn-x">
    <span>流光边框</span>
  </div>
</body>

</html>
